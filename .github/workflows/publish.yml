name: Publish verified daily digest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
concurrency:
  group: daily-news-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate Apple home screen icon
        run: python3 scripts/make_icon.py
      - name: Generate sourced digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
        run: python3 scripts/publish.py
      - name: Validate generated artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          html=Path('docs/index.html').read_text(encoding='utf-8')
          assert html.lower().startswith('<!doctype html>')
          root=ET.parse('docs/feed.xml').getroot()
          assert root.tag=='rss'
          items=root.findall('./channel/item')
          assert len(items)==20, f'Expected 20 stories (4 categories × 5), got {len(items)}'
          assert html.count('class="category-panel"') == 4, 'Expected four category panels'
          assert html.count('class="story"') == 20, 'Expected twenty article cards'
          PY
      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/feed.xml docs/apple-touch-icon.png docs/icon.svg
          git diff --cached --quiet || (git commit -m "Publish daily sourced digest" && git push)
