name: Publish verified daily digest
run-name: ${{ inputs.linux_timer && 'Publish daily digest · Ubuntu timer' || 'Publish verified daily digest' }}
on:
  workflow_dispatch:
    inputs:
      linux_timer:
        description: Apply the scheduled edition check for the Ubuntu timer
        type: boolean
        default: false
      vision_check_only:
        description: Check the visual review connection using known news photos
        type: boolean
        default: false
      preview_only:
        description: Generate and review an edition without publishing or synthesizing audio
        type: boolean
        default: false
      audio_only:
        description: Regenerate audio for the currently published edition
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-news-publish
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ !inputs.vision_check_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose scheduler timing
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          now = datetime.datetime.now(datetime.timezone.utc)
          print("event_name:", os.environ.get("GH_EVENT_NAME"))
          print("event_schedule:", os.environ.get("GH_EVENT_SCHEDULE") or "(none)")
          print("run_id:", os.environ.get("GH_RUN_ID"))
          print("run_attempt:", os.environ.get("GH_RUN_ATTEMPT"))
          print("commit_sha:", os.environ.get("GH_SHA"))
          print("runner_started_utc:", now.isoformat())
          print("runner_started_beijing:", now.astimezone(datetime.timezone(datetime.timedelta(hours=8))).isoformat())
          print("note: runner start is not the exact scheduler enqueue time; compare with run created_at via Actions API")
          PY
      - name: Check whether today's edition is already published
        id: edition
        if: ${{ inputs.linux_timer && !inputs.preview_only && !inputs.audio_only }}
        run: |
          git fetch origin main
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from zoneinfo import ZoneInfo

          timezone = ZoneInfo("Asia/Shanghai")
          today = dt.datetime.now(timezone).date()

          def read_published(path):
              return subprocess.check_output(["git", "show", f"origin/main:{path}"], text=True)

          try:
              feed = ET.fromstring(read_published("docs/feed.xml"))
              build_date = parsedate_to_datetime(feed.findtext("./channel/lastBuildDate", ""))
              podcast = json.loads(read_published("docs/podcast/latest.json"))
              already_published = (
                  build_date.astimezone(timezone).date() == today
                  and podcast.get("date") == today.isoformat()
                  and podcast.get("status") == "audio_ready"
              )
          except (subprocess.CalledProcessError, ET.ParseError, ValueError, TypeError):
              already_published = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"already_published={str(already_published).lower()}", file=output)
          print(f"Beijing edition {today} already published: {already_published}")
          PY
      - name: Generate Apple home screen icon
        if: ${{ steps.edition.outputs.already_published != 'true' && !inputs.audio_only }}
        run: python3 scripts/make_icon.py
      - name: Generate and review sourced digest
        if: ${{ steps.edition.outputs.already_published != 'true' && (inputs.preview_only || !inputs.audio_only) }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_WORKSPACE_ID: ${{ secrets.DASHSCOPE_WORKSPACE_ID }}
        run: python3 scripts/publish.py
      - name: Validate generated artifacts
        if: ${{ steps.edition.outputs.already_published != 'true' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          html=Path('docs/index.html').read_text(encoding='utf-8')
          assert html.lower().startswith('<!doctype html>')
          root=ET.parse('docs/feed.xml').getroot()
          assert root.tag=='rss'
          items=root.findall('./channel/item')
          assert len(items)==25, f'Expected 25 stories (5 categories × 5), got {len(items)}'
          assert html.count('class="category-panel"') == 5, 'Expected five category panels'
          assert html.count('class="story"') == 25, 'Expected twenty-five article cards'
          PY
      - name: Install audio tools
        if: ${{ steps.edition.outputs.already_published != 'true' && !inputs.preview_only }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Prepare source-grounded podcast transcript
        if: ${{ steps.edition.outputs.already_published != 'true' && !inputs.preview_only }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_WORKSPACE_ID: ${{ secrets.DASHSCOPE_WORKSPACE_ID }}
          DASHSCOPE_TTS_MODEL: qwen-audio-3.1-tts-flash
          PODCAST_TTS_WORKERS: "4"
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ] || [ -z "$DASHSCOPE_WORKSPACE_ID" ]; then
            echo "::error::Missing DashScope credentials for podcast generation"
            exit 1
          fi
          python3 -m pip install --quiet 'dashscope>=2.0.1'
          python3 scripts/build_podcast.py
      - name: Validate browser JavaScript syntax
        if: ${{ steps.edition.outputs.already_published != 'true' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          page = Path('docs/index.html').read_text(encoding='utf-8')
          class ScriptCollector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and not dict(attrs).get('src'):
                      self.inside = True
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.parts.append(data)
          collector = ScriptCollector()
          collector.feed(page)
          assert collector.parts, 'Missing inline JavaScript'
          Path('/tmp/daily-news-inline.js').write_text(chr(10).join(collector.parts), encoding='utf-8')
          PY
          node --check /tmp/daily-news-inline.js
      - name: Commit publication
        if: ${{ steps.edition.outputs.already_published != 'true' && !inputs.preview_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/feed.xml docs/apple-touch-icon.png docs/icon.svg docs/podcast/latest.json docs/podcast/latest.txt
          git add -A docs/podcast/
          if [ -f scripts/cosyvoice-v3.5-flash.voice ]; then
            git add scripts/cosyvoice-v3.5-flash.voice
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily sourced digest"
            # Another push may land while this workflow generates the edition.
            # Rebase the publication on the latest main instead of force-pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Publication conflicts with newer changes on main; refusing to overwrite them."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Publication pushed successfully"
                exit 0
              fi
              echo "Concurrent push detected (attempt $attempt); retrying"
              sleep $((attempt * 2))
            done
            echo "::error::Could not push publication after five retries"
            exit 1
          fi

  verify-vision:
    if: ${{ inputs.vision_check_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check the live image reviewer
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_WORKSPACE_ID: ${{ secrets.DASHSCOPE_WORKSPACE_ID }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          from editorial_review import review_image, vision_connection
          url, key, model = vision_connection()
          assert url, "No configured image-review model answered the live image probe"
          article = {"title": "各地拓宽住房公积金使用范围", "summary": "央视报道多地调整住房公积金用途和办理服务。"}
          unrelated = "https://imgcdn.cna.com.tw/www/WebPhotos/1024/20261123/1152x768_wmky_0_C20261123000145.jpg"
          relevant = "https://p1.img.cntv.cn/photoworkspace/contentimg/2026/11/23/2026112319595746517.jpg"
          source = {"title": article["title"], "publisher": "央视网", "url": "https://news.cctv.cn/2026/11/23/ARTIqOLhFXOiHJDEO5LDeiNs261123.shtml", "body_images": [unrelated, relevant]}
          result = review_image(article, [source], url, key, model=model)
          assert result and result[0][0] == relevant, "Live image reviewer did not distinguish the matching image"
          print("Live reviewer rejects the unrelated signing photo and selects the matching CCTV report frame.")
          PY
